// Written by Kone Tshivhinda (Qoder) on 2026-11-03 — Common watermark type (P2 task 2.2)
// Modified by Kone Tshivhinda (Gemini 4 Argon) on 2026-11-04 - Add Go and Java package options for polyglot codegen (P2 task 2.1)
syntax = "proto3";

package vigil.common.v1;

option go_package = "github.com/konethegreat/Vigil/gen/go/vigil/common/v1;commonv1";
option java_multiple_files = true;
option java_package = "africa.vigil.contracts.common.v1";

// Watermark identifies a point in the edit stream that a read has observed.
//
// The value is opaque and starts with wm1_ (API_DESIGN §A.9). Clients store
// and return it verbatim; they never parse it.
message Watermark {
  // Opaque watermark token.
  string value = 1;
}
