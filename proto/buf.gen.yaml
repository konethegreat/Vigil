# Written by Kone Tshivhinda (Gemini 4 Argon) on 2026-11-04 - Buf v2 codegen configuration for the six Vigil contract languages (P2 task 2.1)
version: v2
plugins:
  - remote: buf.build/protocolbuffers/java:v33.1
    out: sdks/_codegen/gen/java
  - remote: buf.build/protocolbuffers/kotlin:v33.1
    out: sdks/_codegen/gen/kotlin
  - remote: buf.build/protocolbuffers/python:v33.1
    out: sdks/_codegen/gen/python
  - remote: buf.build/protocolbuffers/pyi:v33.1
    out: sdks/_codegen/gen/python
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: sdks/_codegen/gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.9.0
    out: sdks/_codegen/gen/ts
    opt: target=ts
  - remote: buf.build/community/neoeinstein-prost:v0.4.0
    out: sdks/_codegen/gen/rust
