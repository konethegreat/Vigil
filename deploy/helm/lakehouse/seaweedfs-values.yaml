# Written by Kone Tshivhinda (Gemini 4 Argon) on 2026-11-04 - SeaweedFS S3 object store Helm values for the Vigil lakehouse (P4 tasks 4.1, 4.7)
# SeaweedFS is Apache-2.0 licensed (ADR-0003) and provides sovereign pod-local S3 storage for Iceberg v3 and LanceDB.

replicaCount: 3

seaweedfs:
  image:
    repository: chrislusf/seaweedfs
    tag: "3.79"
    pullPolicy: IfNotPresent

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  s3:
    enabled: true
    port: 8333
    tlsMinVersion: "1.3"
    endpoint: "https://s3.za-gp-1.vigil.internal"
    warehouseBucket: "vigil-za-gp-1-lake"
    stagingPrefixPattern: "{tenant}/_staging/{transaction_uuid}/"
    stsCredentials:
      maxTtlSeconds: 900
      requireWardenDecision: true
      allowedActions:
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:ListBucket"

  encryption:
    # Per-dataset DEKs (AES-256-GCM) wrapped by tenant KEKs from P3.8 OpenBao transit.
    algorithm: "AES-256-GCM"
    kmsProvider: "openbao-transit"
    keyChannel: "dataset-object"
    aadTemplate: "{tenant}|{dataset_rid}|{branch}|{object_path}"
