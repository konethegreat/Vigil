# Written by Kone Tshivhinda (Gemini 4 Argon) on 2026-11-04 - OpenBao in-boundary KMS configuration for Vigil (P3 task 3.8)
# OpenBao is MPL-2.0 licensed and runs inside the sovereign pod boundary behind PKCS#11 HSM auto-unseal.

replicaCount: 3

openbao:
  image:
    repository: quay.io/openbao/openbao
    tag: "2.1.0"
    pullPolicy: IfNotPresent

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  transit:
    enabled: true
    mountPath: "transit"
    keyHierarchy:
      # Per-tenant KEKs wrap dataset DEKs and class-specific cipher_text channel DEKs.
      tenantKekPattern: "tenant-{{tenant}}-kek"
      channels:
        - name: "pii"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
        - name: "special-pi"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
        - name: "criminal-conduct"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
        - name: "child"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
        - name: "justification"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
        - name: "dataset-object"
          type: "aes256-gcm96"
          derived: true
          convergentEncryption: false
      signingKeys:
        - name: "policy-ctx-hmac"
          type: "hmac"
          minCustodians: 2
        - name: "audit-signing"
          type: "ed25519"
          minCustodians: 2
