[project]
name = "vigil-mind"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Attribution headers written by earlier contributors exceed the 100-column limit.
"scripts/*.py" = ["E501"]
