spring.application.name=vigil-service-template
server.port=${VIGIL_PORT:8000}

# Required: an unresolved value stops startup (fail fast, BACKEND_GUIDE B4).
vigil.warden-url=${VIGIL_WARDEN_URL}
vigil.internal-token-ref=${VIGIL_INTERNAL_TOKEN_REF}
vigil.service-name=${VIGIL_SERVICE_NAME:vigil-service-template}
vigil.environment=${VIGIL_ENVIRONMENT:dev}

# Leave empty to disable OTLP export. No required egress.
vigil.otel-endpoint=${VIGIL_OTEL_ENDPOINT:}
