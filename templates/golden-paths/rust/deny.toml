# Written by Kone Tshivhinda (Qoder) on 2026-11-01 — ADR-0003 licence and supply-chain policy for the Rust golden paths (P1 task 1.4)
#
# The licence allow-list mirrors the green set in .github/workflows/sbom-license-scan.yml, which
# the ADR-0003 gate applies to every other ecosystem. cargo deny reads real registry metadata, so
# this is the authoritative licence check for Cargo.lock; the SBOM gate delegates cargo packages
# here because Syft has no Rust remote-licence lookup.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The list is the whole ADR-0003 green set, not the observed set, so a copied template
# accepts the same licences as the SBOM gate. Entries this graph does not use are not
# a finding; a licence outside the set still fails.
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "EPL-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
