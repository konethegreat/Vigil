# Written by Kone Tshivhinda (Qoder) on 2026-11-03 — AsyncAPI 3 catalogue for the Vigil event contracts (P2 task 2.3)
asyncapi: 3.1.0
id: urn:vigil:asyncapi:events
info:
  title: Vigil Events
  version: 1.0.0
  description: |
    CloudEvents 1.0 over Kafka in binary mode (API_DESIGN Part C). The envelope
    is vigil.events.v1.EventEnvelope; payloads are domain protobuf messages.
    Topics are <tenant>.<domain>.<stream>.v1 with 7-day retention and no
    compaction. Payloads carry RIDs, primary keys, counts and property names,
    never property values.
  contact:
    name: Kone Tshivhinda
    url: https://github.com/konethegreat/Vigil
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/protobuf
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    protocolVersion: '4.0'
    description: Core event bus (KRaft, ARCHITECTURE §6.3).
channels:
  forgeDatasets:
    address: '{tenant}.forge.datasets.v1'
    description: Dataset transaction outcomes.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      transactionCommitted:
        $ref: '#/components/messages/forgeDatasetTransactionCommitted'
      transactionAborted:
        $ref: '#/components/messages/forgeDatasetTransactionAborted'
  ontologyTypes:
    address: '{tenant}.ontology.types.v1'
    description: Ontology type publications.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      typePublished:
        $ref: '#/components/messages/ontologyTypePublished'
  indexerObjects:
    address: '{tenant}.indexer.objects.v1'
    description: Indexer progress and read-your-writes signals.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      objectsIndexed:
        $ref: '#/components/messages/indexerObjectsIndexed'
  ontologyEdits:
    address: '{tenant}.ontology.edits.v1'
    description: Applied ontology edits from the action outbox.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      editsApplied:
        $ref: '#/components/messages/ontologyEditsApplied'
  actionsRuns:
    address: '{tenant}.actions.runs.v1'
    description: Action run lifecycle and side-effect failures.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      runStaged:
        $ref: '#/components/messages/actionRunStaged'
      runDecided:
        $ref: '#/components/messages/actionRunDecided'
      sideEffectFailed:
        $ref: '#/components/messages/actionSideEffectFailed'
  auditEvents:
    address: '{tenant}.audit.events.v1'
    description: Hash-chained audit events.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      eventRecorded:
        $ref: '#/components/messages/auditEventRecorded'
  wardenGates:
    address: '{tenant}.warden.gates.v1'
    description: Gated-module authorisation changes.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      gateChanged:
        $ref: '#/components/messages/wardenGateChanged'
  erRuns:
    address: '{tenant}.er.runs.v1'
    description: Entity-resolution run outcomes.
    parameters:
      tenant:
        description: Tenant slug.
    messages:
      runCompleted:
        $ref: '#/components/messages/erRunCompleted'
operations:
  sendForgeDatasets:
    action: send
    channel:
      $ref: '#/channels/forgeDatasets'
    messages:
      - $ref: '#/channels/forgeDatasets/messages/transactionCommitted'
      - $ref: '#/channels/forgeDatasets/messages/transactionAborted'
  sendOntologyTypes:
    action: send
    channel:
      $ref: '#/channels/ontologyTypes'
    messages:
      - $ref: '#/channels/ontologyTypes/messages/typePublished'
  sendIndexerObjects:
    action: send
    channel:
      $ref: '#/channels/indexerObjects'
    messages:
      - $ref: '#/channels/indexerObjects/messages/objectsIndexed'
  sendOntologyEdits:
    action: send
    channel:
      $ref: '#/channels/ontologyEdits'
    messages:
      - $ref: '#/channels/ontologyEdits/messages/editsApplied'
  sendActionsRuns:
    action: send
    channel:
      $ref: '#/channels/actionsRuns'
    messages:
      - $ref: '#/channels/actionsRuns/messages/runStaged'
      - $ref: '#/channels/actionsRuns/messages/runDecided'
      - $ref: '#/channels/actionsRuns/messages/sideEffectFailed'
  sendAuditEvents:
    action: send
    channel:
      $ref: '#/channels/auditEvents'
    messages:
      - $ref: '#/channels/auditEvents/messages/eventRecorded'
  sendWardenGates:
    action: send
    channel:
      $ref: '#/channels/wardenGates'
    messages:
      - $ref: '#/channels/wardenGates/messages/gateChanged'
  sendErRuns:
    action: send
    channel:
      $ref: '#/channels/erRuns'
    messages:
      - $ref: '#/channels/erRuns/messages/runCompleted'
components:
  messageTraits:
    cloudEventHeaders:
      headers:
        type: object
        required:
          - ce-specversion
          - ce-id
          - ce-source
          - ce-type
          - ce-subject
          - ce-time
          - ce-datacontenttype
          - ce-dataschema
          - ce-vigiltenant
          - ce-vigilclass
        properties:
          ce-specversion:
            type: string
            const: '1.0'
          ce-id:
            type: string
            format: uuid
            description: UUIDv7 outbox event_id.
          ce-source:
            type: string
            pattern: '^//vigil/[a-z]{2}-[a-z]{2}-[0-9]+/[a-z][a-z0-9]{2,29}/[a-z0-9-]+$'
            description: //vigil/<pod>/<tenant>/<service>.
          ce-type:
            type: string
            pattern: '^vigil(\.[a-z0-9]+)+\.v[0-9]+$'
            description: vigil.<domain>.<entity>.<verb>.v1.
          ce-subject:
            type: string
            description: Resource RID the event is about.
          ce-time:
            type: string
            format: date-time
          ce-datacontenttype:
            type: string
            const: application/protobuf
          ce-dataschema:
            type: string
            pattern: '^urn:vigil:proto:[A-Za-z0-9_.]+$'
            description: urn:vigil:proto:<fully.qualified.Message>.
          ce-vigiltenant:
            type: string
            description: Tenant slug.
          ce-vigilclass:
            type: string
            enum: ['0', '1', '2', '3', '4']
            description: Classification level (0 PUBLIC to 4 TOP_SECRET).
          ce-vigilmarkings:
            type: string
            description: Comma-separated marking identifiers.
          ce-vigilwatermark:
            type: string
            description: Opaque watermark.
          ce-partitionkey:
            type: string
            description: Partition key, a RID or another non-personal key.
          ce-traceparent:
            type: string
            description: W3C trace context.
  messages:
    forgeDatasetTransactionCommitted:
      name: vigil.forge.dataset.transaction.committed.v1
      title: Dataset transaction committed
      summary: A dataset transaction committed and its label was propagated.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ForgeDatasetTransactionCommitted'
    forgeDatasetTransactionAborted:
      name: vigil.forge.dataset.transaction.aborted.v1
      title: Dataset transaction aborted
      summary: A dataset transaction aborted, for example on a BLOCK quality check.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ForgeDatasetTransactionAborted'
    ontologyTypePublished:
      name: vigil.ontology.type.published.v1
      title: Ontology type published
      summary: An object, link, action or function type was published.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/OntologyTypePublished'
    indexerObjectsIndexed:
      name: vigil.indexer.objects.indexed.v1
      title: Objects indexed
      summary: The indexer completed a batch and advanced the watermark.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/IndexerObjectsIndexed'
    ontologyEditsApplied:
      name: vigil.ontology.edits.applied.v1
      title: Ontology edits applied
      summary: The action engine applied edits and wrote them to the outbox.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/OntologyEditsApplied'
    actionRunStaged:
      name: vigil.actions.run.staged.v1
      title: Action run staged
      summary: A run was staged for approval.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ActionRunStaged'
    actionRunDecided:
      name: vigil.actions.run.decided.v1
      title: Action run decided
      summary: An approval was decided.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ActionRunDecided'
    actionSideEffectFailed:
      name: vigil.actions.sideeffect.failed.v1
      title: Action side effect failed
      summary: A side effect failed and its compensation was attempted.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ActionSideEffectFailed'
    auditEventRecorded:
      name: vigil.audit.event.recorded.v1
      title: Audit event recorded
      summary: An audit event was appended to the hash chain.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/AuditEventRecorded'
    wardenGateChanged:
      name: vigil.warden.gate.changed.v1
      title: Warden gate changed
      summary: A gated-module authorisation changed state.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/WardenGateChanged'
    erRunCompleted:
      name: vigil.er.run.completed.v1
      title: Entity-resolution run completed
      summary: An entity-resolution run completed and produced review work.
      contentType: application/protobuf
      traits:
        - $ref: '#/components/messageTraits/cloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ErRunCompleted'
  schemas:
    Label:
      type: object
      description: Security label propagated from the inputs (W5).
      properties:
        markings:
          type: array
          items:
            type: string
        classification:
          type: integer
          minimum: 0
          maximum: 4
        releasability:
          type: array
          items:
            type: string
        purpose_tags:
          type: array
          items:
            type: string
    ObjectEdit:
      type: object
      description: One object changed by an applied edit.
      properties:
        object_type:
          type: string
        pk:
          type: string
        rid:
          type: string
        op:
          type: string
          description: CREATE, MODIFY or DELETE.
        changed_properties:
          type: array
          items:
            type: string
    ForgeDatasetTransactionCommitted:
      type: object
      properties:
        dataset_rid:
          type: string
        transaction_rid:
          type: string
        branch:
          type: string
        type:
          type: string
          description: Transaction type recorded by Forge.
        snapshot_id:
          type: string
          description: Iceberg snapshot id, an int64 as a JSON string.
        rows_added:
          type: integer
          format: int64
        rows_deleted:
          type: integer
          format: int64
        schema_version:
          type: integer
        label:
          $ref: '#/components/schemas/Label'
        lineage_run_id:
          type: string
        committed_by:
          type: string
        committed_at:
          type: string
          format: date-time
    ForgeDatasetTransactionAborted:
      type: object
      properties:
        dataset_rid:
          type: string
        transaction_rid:
          type: string
        reason_code:
          type: string
        failed_checks:
          type: array
          items:
            type: string
    OntologyTypePublished:
      type: object
      properties:
        type_rid:
          type: string
        type_kind:
          type: string
        api_name:
          type: string
        version:
          type: integer
        compat:
          type: string
        branch:
          type: string
        definition_sha256:
          type: string
        published_by:
          type: string
        published_at:
          type: string
          format: date-time
    IndexerObjectsIndexed:
      type: object
      properties:
        object_type:
          type: string
        branch:
          type: string
        watermark:
          type: string
        source_transactions:
          type: array
          items:
            type: string
        rows_upserted:
          type: integer
          format: int64
        rows_deleted:
          type: integer
          format: int64
        full_reindex:
          type: boolean
        alias_swapped:
          type: boolean
        indexed_at:
          type: string
          format: date-time
    OntologyEditsApplied:
      type: object
      properties:
        action_run_id:
          type: string
        action_type:
          type: string
        edit_seq_from:
          type: string
          description: Edit sequence, an int64 as a JSON string.
        edit_seq_to:
          type: string
          description: Edit sequence, an int64 as a JSON string.
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectEdit'
        label:
          $ref: '#/components/schemas/Label'
        applied_by:
          type: string
        on_behalf_of:
          type: string
          description: Empty when the principal acts for itself.
        purpose:
          type: string
        applied_at:
          type: string
          format: date-time
    ActionRunStaged:
      type: object
      properties:
        action_run_id:
          type: string
        action_type:
          type: string
        submitted_by:
          type: string
        submitted_via:
          type: string
        agent_session_id:
          type: string
        approval_request_id:
          type: string
        approver_role:
          type: string
        expires_at:
          type: string
          format: date-time
    ActionRunDecided:
      type: object
      properties:
        action_run_id:
          type: string
        approval_request_id:
          type: string
        outcome:
          type: string
          enum: [APPROVED, REJECTED, EXPIRED]
        decided_by:
          type: array
          items:
            type: string
        final_status:
          type: string
    ActionSideEffectFailed:
      type: object
      properties:
        action_run_id:
          type: string
        effect_index:
          type: integer
        kind:
          type: string
        attempts:
          type: integer
        error_code:
          type: string
        compensated:
          type: boolean
    AuditEventRecorded:
      type: object
      properties:
        seq:
          type: string
          description: Audit chain sequence, an int64 as a JSON string.
        event_id:
          type: string
        event_type:
          type: string
        actor_type:
          type: string
        decision:
          type: string
        resource_rid:
          type: string
        hash:
          type: string
    WardenGateChanged:
      type: object
      properties:
        gate:
          type: string
        authorisation_id:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, EXPIRED, REVOKED]
        valid_to:
          type: string
          format: date-time
    ErRunCompleted:
      type: object
      properties:
        run_id:
          type: string
        entity_class:
          type: string
        model_version:
          type: string
        links_auto:
          type: integer
        links_pending:
          type: integer
        clusters_changed:
          type: integer
        linkage_classes:
          type: array
          items:
            type: string
        gate_refusals:
          type: integer
          description: Number of candidate links refused by a gate.
