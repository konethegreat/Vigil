# Written by Kone Tshivhinda (Gemini 3.8 Flash) on 2026-10-16 — Dependabot automated vulnerability & dependency updates
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Point npm at the pnpm workspace root, use the uv ecosystem, group minor updates
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Ignore pending majors until the toolchain supports them
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Watch Dockerfiles in their actual directories, not the repository root
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Hold container runtimes at the versions the project supports
#
# Dependabot PRs are advisory: INSTRUCTIONS §12 requires a WORKLOG row and §8 an attribution line per
# change, which the bot cannot add, so maintainers port each batch into a governed `chore/repo` branch.
# The lockfiles must be updated by the ecosystem itself (`pnpm`, `uv`, Gradle), which is why npm points at
# the workspace root and Python uses the uv ecosystem rather than pip. Each Docker ecosystem entry
# names a directory that really contains a Dockerfile, because the updater scans only that directory.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint declares <6.1.0; revisit when it accepts TypeScript 7.
      - dependency-name: "typescript"
        versions: ["7.x", ">=7.0.0"]
      # The Next.js lint plugins declare ESLint <=9.
      - dependency-name: "eslint"
        versions: ["10.x", ">=10.0.0"]
      # CI runs Node 24 LTS; move together with the runtime.
      - dependency-name: "@types/node"
        versions: ["25.x", ">=25.0.0"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/mind"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    ignore:
      # Spotless 8 drops formatter dependencies from gradle.lockfile, reducing SBOM coverage.
      - dependency-name: "com.diffplug.spotless"
        versions: [">=8.0.0"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/apps/cockpit"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 2
    ignore:
      # CI runs Node 24 LTS; move the base image together with the runtime.
      - dependency-name: "node"
        versions: [">=25.0.0"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/services/core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 2
    ignore:
      # Stay on Gradle 9.x; a major build-tool upgrade is a project decision.
      - dependency-name: "gradle"
        versions: [">=10.0.0"]
      # Stay on Java 25 until the language charter moves.
      - dependency-name: "eclipse-temurin"
        versions: [">=26.0.0"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/services/mind"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 2
    ignore:
      # The project pins Python 3.13 (P1 task 1.1).
      - dependency-name: "python"
        versions: [">=3.14.0"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/infra/docker/ci"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/infra/docker/postgres"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
