# Written by Kone Tshivhinda (Gemini 3.8 Flash) on 2026-10-16 — Dependabot automated vulnerability & dependency updates
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Point npm at the pnpm workspace root, use the uv ecosystem, group minor updates
#
# Dependabot PRs are advisory: INSTRUCTIONS §12 requires a WORKLOG row and §8 an attribution line per
# change, which the bot cannot add, so maintainers port each batch into a governed `chore/repo` branch.
# The lockfiles must be updated by the ecosystem itself (`pnpm`, `uv`, Gradle), which is why npm points at
# the workspace root and Python uses the uv ecosystem rather than pip.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/mind"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
