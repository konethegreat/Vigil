# Written by Kone Tshivhinda (Claude Opus 5.5) on 2026-09-25 — Polyglot backend CI: path-filtered Python, Java, Rust, Go, Kotlin/Android, Elixir and Protobuf gates that no-op until each project exists (P0)
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Activate the Python job for services/mind
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Refresh action pins
#
# Skill §3 ci-backend, generalised to the ADR-0001 language charter. A language job runs only when
# (a) its paths changed and (b) its project entrypoint exists, so the workflow stays green and
# cheap while the repository has no service code (AI_COMMUNICATION MSG-003).
# Required status check: the `ci-backend` gate job (a skipped job would otherwise count as passing).
# Local mirror: `just ci-backend` → scripts/ci/run-backend.sh. Bump versions together with
# infra/docker/ci/Dockerfile.
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Refresh action pins (second batch)
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Add the mypy --strict and branch-coverage MUST gates (P1 task 1.7)
# Modified by Kone Tshivhinda (Qoder) on 2026-10-31 — Verify the golden-path templates (P1 task 1.4)
# Modified by Kone Tshivhinda (Qoder) on 2026-11-01 — Add the Java 25 toolchain to the templates job (P1 task 1.4)
# Modified by Kone Tshivhinda (Qoder) on 2026-11-01 — Add the Node 24 and pnpm toolchains to the templates job (P1 task 1.4)
name: ci-backend

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "25"
  NODE_VERSION: "24" # Node 24 LTS (INSTRUCTIONS §6)
  ANDROID_JAVA_VERSION: "21" # LTS supported by the Android Gradle Plugin; P27 may raise it
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  OTP_VERSION: "28"
  ELIXIR_VERSION: "1.19"
  BUF_VERSION: "1.73.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    outputs:
      python: ${{ steps.decide.outputs.python }}
      templates: ${{ steps.decide.outputs.templates }}
      java: ${{ steps.decide.outputs.java }}
      rust: ${{ steps.decide.outputs.rust }}
      go: ${{ steps.decide.outputs.go }}
      android: ${{ steps.decide.outputs.android }}
      elixir: ${{ steps.decide.outputs.elixir }}
      proto: ${{ steps.decide.outputs.proto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which paths changed?
        id: filter
        if: ${{ !env.ACT }} # under `act` every present project is checked
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref_name }} # push: compare with the commit before the push
          filters: |
            python:
              - '**/*.py'
              - '**/pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-backend.yml'
            templates:
              - 'templates/golden-paths/**'
              - 'scripts/ci/run-templates.sh'
              - '.github/workflows/ci-backend.yml'
            java:
              - '**/*.java'
              - '**/*.gradle.kts'
              - '**/gradle.lockfile'
              - 'gradle/**'
              - 'gradlew'
              - 'gradle.properties'
              - 'services/core/**'
              - 'services/forge-datasets/**'
              - 'services/forge-connectors/**'
              - 'packs/**'
              - '.github/workflows/ci-backend.yml'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci-backend.yml'
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.golangci.yml'
              - '.github/workflows/ci-backend.yml'
            android:
              - 'edge/field-app/**'
              - '.github/workflows/ci-backend.yml'
            elixir:
              - 'services/comms/**'
              - '.github/workflows/ci-backend.yml'
            proto:
              - 'proto/**'
              - '.github/workflows/ci-backend.yml'

      - name: Decide which language gates run (changed AND project present)
        id: decide
        env:
          F_PYTHON: ${{ steps.filter.outputs.python }}
          F_TEMPLATES: ${{ steps.filter.outputs.templates }}
          F_JAVA: ${{ steps.filter.outputs.java }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_GO: ${{ steps.filter.outputs.go }}
          F_ANDROID: ${{ steps.filter.outputs.android }}
          F_ELIXIR: ${{ steps.filter.outputs.elixir }}
          F_PROTO: ${{ steps.filter.outputs.proto }}
        run: |
          # decide NAME CHANGED TEST... (an empty CHANGED means the filter was skipped: treat as changed)
          decide() {
            local name="$1" changed="${2:-true}" run=false
            shift 2
            if [ "$changed" = "true" ] && "$@"; then run=true; fi
            echo "$name=$run" >> "$GITHUB_OUTPUT"
            echo "$name: changed=$changed run=$run"
          }
          has_go_module() { git ls-files -- 'go.mod' '*/go.mod' | grep -q .; }
          decide python  "$F_PYTHON"  test -f services/mind/pyproject.toml
          decide templates "$F_TEMPLATES" test -d templates/golden-paths/python
          decide java    "$F_JAVA"    test -f gradlew
          decide rust    "$F_RUST"    test -f Cargo.toml
          decide go      "$F_GO"      has_go_module
          decide android "$F_ANDROID" test -f edge/field-app/gradlew
          decide elixir  "$F_ELIXIR"  test -f services/comms/mix.exs
          decide proto   "$F_PROTO"   test -f proto/buf.yaml

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OS packages for geo / PDF stacks (GDAL, PROJ, GEOS, Pango), only when those services exist
        if: hashFiles('services/eo/**', 'services/sim/**', 'services/mind/docai/**') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libproj-dev proj-bin libgeos-dev \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: uv sync (locked; lockfiles are committed, INSTRUCTIONS §6.5)
        run: uv sync --locked --all-packages

      - name: ruff check
        timeout-minutes: 3
        run: uv run ruff check .

      - name: ruff format --check
        timeout-minutes: 3
        run: uv run ruff format --check .

      - name: mypy --strict
        timeout-minutes: 3
        run: uv run mypy --strict vigil_mind

      - name: pytest (branch coverage ≥ 85 %)
        timeout-minutes: 3
        run: uv run pytest --cov=vigil_mind --cov-branch --cov-report=term-missing --cov-fail-under=85

      - name: 100 % coverage for connector and policy modules (skill §3)
        timeout-minutes: 3
        run: |
          if git ls-files -- '*/connectors/*.py' '*/policy/*.py' | grep -q .; then
            uv run coverage report --include='*/connectors/*,*/policy/*' --fail-under=100
          else
            echo "No Python connectors/ or policy/ modules yet: gate not applicable."
          fi

  templates:
    name: templates
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: templates/golden-paths/typescript/service/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: "templates/golden-paths/typescript/**/pnpm-lock.yaml"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1 # keep in step with templates/golden-paths/rust/rust-toolchain.toml
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: templates/golden-paths/rust -> target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Golden-path templates (lint, types and tests)
        timeout-minutes: 25 # composite of the Python, Java, TypeScript and Rust template gates; the Java and Rust builds are compile-inclusive (MSG-027)
        run: bash scripts/ci/run-templates.sh

  java:
    name: java
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1; also validates the committed Gradle wrapper
      - name: Start disposable test database and Mind
        run: docker compose -f docker-compose.dev.yml --profile checks up -d --wait test-db mind-test
      - name: Gradle spotlessCheck · check · test
        timeout-minutes: 15 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5548/vigil
          VIGIL_DEMO_MODE: "true"
          VIGIL_INTERNAL_TOKEN: local-synthetic-mission-only
          VIGIL_SESSION_KEY: local-synthetic-session-key-not-for-production
          VIGIL_MIND_URL: http://127.0.0.1:8017
        run: ./gradlew --no-daemon spotlessCheck check test
      - name: Remove disposable test database and Mind
        if: always()
        run: docker compose -f docker-compose.dev.yml --profile checks down -v

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable # explicit, because a SHA pin cannot name the toolchain
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo fmt --check
        timeout-minutes: 3
        run: cargo fmt --all --check
      - name: cargo clippy (warnings are errors)
        timeout-minutes: 15 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-deny and cargo-llvm-cov (only when a Cargo workspace exists)
        timeout-minutes: 10 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: |
          cargo install cargo-deny --locked
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: cargo deny check
        timeout-minutes: 3
        run: cargo deny check
      - name: cargo test
        timeout-minutes: 15 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: cargo test --workspace --locked
      - name: cargo llvm-cov (lines ≥ 85 %)
        timeout-minutes: 20 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: cargo llvm-cov --workspace --fail-under-lines 85

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: gofmt (no unformatted files)
        timeout-minutes: 3
        run: |
          unformatted="$(git ls-files -z -- '*.go' ':(exclude)vendor/*' ':(exclude)*/vendor/*' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install golangci-lint (built with the pinned Go)
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: golangci-lint (every module)
        timeout-minutes: 3
        run: |
          status=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::golangci-lint $dir"
            (cd "$dir" && golangci-lint run ./...) || status=1
            echo "::endgroup::"
          done < <(git ls-files -- 'go.mod' '*/go.mod')
          exit "$status"
      - name: go test -race (coverage ≥ 85 %, every module)
        timeout-minutes: 10 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: |
          status=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::go test -race $dir"
            profile="$(mktemp)"
            if (cd "$dir" && go test ./... -race -covermode=atomic -coverprofile="$profile"); then
              total="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
              echo "total coverage: ${total}%"
              awk -v total="$total" 'BEGIN { exit (total + 0 < 85) }' \
                || { echo "::error::$dir coverage ${total}% is below 85%"; status=1; }
            else
              status=1
            fi
            rm -f "$profile"
            echo "::endgroup::"
          done < <(git ls-files -- 'go.mod' '*/go.mod')
          exit "$status"

  android:
    name: kotlin-android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: edge/field-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.ANDROID_JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android lint and unit tests (./gradlew check; the runner image ships the Android SDK)
        timeout-minutes: 15 # compile-inclusive step: recorded exception to the 3-minute rule (MSG-027)
        run: ./gradlew --no-daemon check

  elixir:
    name: elixir
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: services/comms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: mix deps.get
        run: mix deps.get
      - name: mix format --check-formatted
        timeout-minutes: 3
        run: mix format --check-formatted
      - name: credo
        timeout-minutes: 3
        run: mix credo --strict
      - name: mix test
        timeout-minutes: 3
        run: mix test

  proto:
    name: proto
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares against develop
          persist-credentials: false
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: buf lint
        timeout-minutes: 3
        run: buf lint proto
      - name: buf breaking (against develop, ARCHITECTURE §8)
        timeout-minutes: 3
        run: |
          if ! git cat-file -e origin/develop:proto/buf.yaml 2>/dev/null; then
            echo "develop has no proto/buf.yaml yet: nothing to compare against."
            exit 0
          fi
          git branch --force vigil-breaking-base origin/develop
          buf breaking proto --against ".git#branch=vigil-breaking-base,subdir=proto"

  ci-backend:
    name: ci-backend
    if: always()
    needs: [changes, python, templates, java, rust, go, android, elixir, proto]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every language gate passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
