# Written by Kone Tshivhinda (Claude Opus 5.5) on 2026-09-25 — ADR-0003 amber-licence allow-list read by sbom-license-scan.yml (P0)
#
# What this file is
#   The licence gate in .github/workflows/sbom-license-scan.yml classifies every package in the
#   Syft SBOM against ADR-0003 (docs/adr/ADR-0003-open-source-licence-policy.md):
#     🟢 green  Apache-2.0, MIT, BSD, ISC, PostgreSQL, Zlib, … ........ always allowed
#     🟡 amber  GPL, AGPL, LGPL, CC-BY-SA, ODbL, OpenRAIL, Llama ....... FAIL unless listed below
#     🔴 red    BUSL (Business Source), SSPL, Elastic-2.0 (ELv2), FSL,
#               Commons Clause, CC-BY-NC ................................ always FAIL (not listable here)
#   Note: SPDX "BSL-1.0" is the permissive Boost licence (green); the Business Source Licence is "BUSL-1.1".
#   Dual licences are judged by the best option (OR) and the worst obligation (AND).
#
# Before adding an entry (ADR-0003)
#   1. Architecture review plus an ADR note recording the decision.
#   2. The component runs only as an UNMODIFIED, SEPARATE service or process.
#   3. It is NEVER in the edge agent, SDKs, the mobile app or Warden. The SBOM cannot attribute
#      workspace-lockfile entries to one service, so reviewers enforce this rule, not the gate.
#   4. ODbL data stays in separate databases.
#   A red licence needs a purchased commercial licence and a superseding ADR, not an entry here.
#
# Entry format (`package` is an exact SBOM package name or an fnmatch pattern; the other fields are
# the audit trail):
#   - package: ghostscript
#     licence: AGPL-3.0-only
#     adr: ADR-0012
#     scope: services/mind/docai (unmodified separate process)
#     approved_by: <Name> (<AI model>)
#     review_by: 2027-03-31   # ADR-0003: top dependencies are re-reviewed every six months
allowlist:
  # ADR-0003: LGPL may be linked dynamically and used unmodified, with notices. sharp ships an
  # unmodified libvips binary for every platform; only the target platform's binary is installed.
  - package: "@img/sharp-*"
    licence: Apache-2.0 / LGPL-3.0-or-later
    adr: ADR-0003
    scope: apps/cockpit (unmodified dynamically linked libvips; notice in ATTRIBUTION.md)
    approved_by: Kone Tshivhinda (Qoder)
    review_by: 2027-04-30
  # PyPI publishes only an OSI classifier for colorama; its LICENSE.txt is BSD-3-Clause. The gate
  # records this as allow-listed rather than inventing SPDX data from an ambiguous classifier.
  - package: colorama
    licence: BSD-3-Clause
    adr: ADR-0003
    scope: services/mind (unmodified transitive dependency; no SPDX metadata upstream)
    approved_by: Kone Tshivhinda (Qoder)
    review_by: 2027-04-30

