# Written by Kone Tshivhinda (Claude Opus 5.5) on 2026-09-25 — Pre-commit hooks: compliance validator, gitleaks, whitespace/EOF/YAML/size hygiene, ruff, guarded buf lint (P0)
#
# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# Revs are pinned; bump them deliberately (P1 owns this file after P0, AI_COMMUNICATION MSG-003).
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: local
    hooks:
      - id: validate-compliance
        name: Vigil compliance validator (local mode)
        entry: python scripts/validate-compliance.py
        language: python
        pass_filenames: false
        always_run: true
      - id: buf-lint
        name: buf lint (only when proto/ exists)
        entry: bash -c 'if [ -f proto/buf.yaml ]; then buf lint proto; else echo "no proto/buf.yaml yet, skipping"; fi'
        language: system
        files: ^proto/
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm/.*/templates/ # Helm templates are not plain YAML
      - id: check-added-large-files
        # Committed lockfiles can be large and are required (INSTRUCTIONS §6.5, MSG-005).
        exclude: (^|/)(Cargo\.lock|go\.sum|go\.work\.sum|pnpm-lock\.yaml|uv\.lock|gradle\.lockfile|mix\.lock)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Ruff ≥ 0.16 also formats Markdown code blocks. Keep it to Python so it never rewrites the
        # append-only ledgers or other phases' documents.
        types_or: [python, pyi]
