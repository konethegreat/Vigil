api_version: vigil.ontology/v1
kind: ObjectType
metadata:
  api_name: Asset
  display_name: Asset
  description: Critical infrastructure asset, substation, berth, crane, or depot.
  status: ACTIVE
spec:
  primary_key: asset_id
  title_property: name
  existence_policy: SOURCE_WINS
  security:
    classification: RESTRICTED
    markings: []
  properties:
    asset_id: { base_type: string, required: true }
    asset_class: { base_type: string, required: true }
    name: { base_type: string, required: true, searchable: true }
    operator_org_id: { base_type: string }
    location: { base_type: geopoint }
    status: { base_type: string, editable: true, conflict_policy: EDIT_WINS }
    criticality: { base_type: integer }
    security_controls: { base_type: string, column_markings: [SECURITY-MEASURE] }
